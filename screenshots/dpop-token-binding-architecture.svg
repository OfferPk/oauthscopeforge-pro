<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090915"/>
      <stop offset="100%" stop-color="#04040a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bg2)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    OAuth 2.0 vs OAuth 2.1: Bearer Token Exfiltration vs DPoP Token Binding
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14101a" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Bearer Tokens (Legacy OAuth 2.0)
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#0d0d1a" stroke="#2b2b52"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="12">Authorization: Bearer eyJhbGciOiJSUzI1Ni...</text>
  <text x="70" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Unconstrained string. No cryptographic client binding</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">BEARER TOKEN REPLAY ATTACK VECTOR:</text>
  
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Token leaked via proxy access log or telemetry stream</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Attacker replays token from rogue IP (198.51.100.44)</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; API Gateway checks signature &amp; expiry -> APPROVED</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Attacker executes unauthorized $50,000 wire transfer</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CRITICAL REPLAY COMPROMISE &amp; THEFT</text>

  <!-- Right: Hardened Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#0c1729" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: DPoP Proof-of-Possession (RFC 9449)
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#0d0d1a" stroke="#2b2b52"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">Authorization: DPoP eyJ... + DPoP: &lt;proof&gt;</text>
  <text x="560" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Access token bound to client thumbprint: cnf.jkt</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#081723" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">SENDER-CONSTRAINED SECURITY GUARANTEE:</text>
  
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Client generates ephemeral P-256 key pair in hardware</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Proof signs method (POST), URI, and nonce (&lt; 120s)</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Attacker lacks client private key -> Replay drops!</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Gateway returns HTTP 401 invalid_dpop_proof</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">100% CRYPTOGRAPHIC SENDER-CONSTRAINING</text>
</svg>
